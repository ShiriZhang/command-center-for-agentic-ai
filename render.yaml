services:
  - type: web
    name: verifier-service
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn services.verifier.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: VERIFIER_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHONPATH
        value: .
